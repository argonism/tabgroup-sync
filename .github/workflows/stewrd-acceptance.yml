name: stewrd acceptance

on:
  pull_request:
    branches:
      - 'stewrd-validation/**'
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  acceptance-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated acceptance fixtures
        run: python3 -m unittest discover -s stewrd_validation -p 'test_*.py' -v
